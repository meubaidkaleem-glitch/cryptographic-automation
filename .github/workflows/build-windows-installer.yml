name: Build AutoCrypt Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-desktop.txt

      - name: Build native desktop window
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name AutoCrypt --collect-all webview desktop_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build bundled Streamlit server
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name AutoCryptServer --collect-all streamlit --collect-all cryptography --hidden-import=crypto_automation --hidden-import=crypto_automation.crypto --hidden-import=crypto_automation.detect --hidden-import=crypto_automation.jobs --hidden-import=crypto_automation.report --hidden-import=crypto_automation.vault --add-data "crypto_automation;crypto_automation" streamlit_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/AutoCrypt/server | Out-Null
          Copy-Item dist/AutoCryptServer/* dist/AutoCrypt/server -Recurse -Force
          Copy-Item app.py dist/AutoCrypt/app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\AutoCrypt.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrypt-Windows-Installer
          path: release/AutoCrypt-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/AutoCrypt-Setup-Windows-x64.exe
          generate_release_notes: true
