[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptographic-automation"
version = "0.3.0"
description = "Professional cryptographic automation workbench with encoding analysis, protection, key management, batch workflows and audit reporting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43,<48",
  "PyYAML>=6.0,<7",
  "streamlit>=1.38,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
crypto-auto = "crypto_automation.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
